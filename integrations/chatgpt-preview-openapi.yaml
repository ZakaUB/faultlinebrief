openapi: 3.1.0
info:
  title: Faultline Brief Preview Draft Publisher
  version: 1.0.0
  description: Create and inspect article drafts in the isolated Faultline Brief Preview CMS. Publishing is not exposed.
servers:
  - url: https://faultlinebrief-api-gateway.vercel.app
paths:
  /api/articles:
    post:
      operationId: createFaultlineArticleDraft
      summary: Create a draft article in Faultline Brief Preview
      description: >
        Create a new draft article. Gateway enforces status draft. Requires a media ID
        already present in the Preview media collection. The API key must belong
        to a dedicated draft_publisher user, not an administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [headline, slug, deck, body, featuredImage]
              properties:
                headline:
                  type: string
                slug:
                  type: string
                  description: Lowercase URL slug, no spaces or trailing Copy text.
                deck:
                  type: string
                body:
                  type: object
                  description: Valid Payload Lexical rich-text JSON document.
                  additionalProperties: true
                featuredImage:
                  type: integer
                  description: ID of an existing Preview media record.
                sources:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      url:
                        type: string
                seo:
                  type: object
                  properties:
                    title:
                      type: string
                    description:
                      type: string
      responses:
        '201':
          description: Draft created
        '400':
          description: Validation error
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
    get:
      operationId: listFaultlineArticleDrafts
      summary: List draft articles from Preview CMS through gateway
      responses:
        '200':
          description: Articles returned
components:
  schemas: {}
  securitySchemes:
    gatewayApiKey:
      type: apiKey
      in: header
      name: Authorization
      description: "Use the gateway key as: Bearer YOUR_GATEWAY_API_KEY"
security:
  - payloadApiKey: []
