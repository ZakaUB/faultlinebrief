name: Deploy existing CMS Worker with D1 author management to staging
on:
  push:
    branches: [cms-d1-author-management-20261117]
    paths:
      - .github/workflows/deploy-editorial-authors-staging.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faultlinebrief-editorial-authors-staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate existing Worker and staging database target
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const c=JSON.parse(fs.readFileSync('wrangler.editor.d1.staging.jsonc','utf8'))
          if(c.name!=='faultlinebrief-editor-d1-isolated'||c.d1_databases?.length!==1||c.d1_databases[0].database_id!=='d296847d-9bf7-490d-bc95-48345022a938'||c.routes?.length)throw Error('Unsafe staging Worker target')
          console.log('PASS existing editor Worker staging binding')
          NODE
          node --check cloudflare-editor/worker.js
          node --check cloudflare-editor/admin-page.js
      - name: Install Worker dependency
        run: npm install --no-save --no-package-lock pg@8
      - name: Deploy existing editor Worker (staging D1 bindings)
        run: npx --yes wrangler@4.151.1 deploy --config wrangler.editor.d1.staging.jsonc
      - name: Verify existing CMS Worker and author API authentication
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error
          base='https://faultlinebrief-editor-d1-isolated.zakria25.workers.dev'
          for path in ['/me','/editor/authors']:
              try:
                  with urllib.request.urlopen(base+path,timeout=30) as r:status=r.status
              except urllib.error.HTTPError as e:status=e.code
              if status!=401:raise SystemExit(f'Unexpected anonymous access: {path} {status}')
              print('PASS unauthorized request blocked:',path)
          with urllib.request.urlopen(base+'/admin',timeout=30) as r:
              page=r.read().decode()
              assert r.status==200 and 'addAuthor' in page and 'newAuthor' in page
          print('PASS CMS author controls deployed')
          PY
