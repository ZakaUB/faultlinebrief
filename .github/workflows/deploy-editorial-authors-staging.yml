name: Deploy isolated author-management CMS staging Worker
on:
  push:
    branches: [cms-d1-author-management-20261117]
    paths:
      - .github/workflows/deploy-editorial-authors-staging.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faultlinebrief-author-cms-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify staging isolation and source syntax
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const c=JSON.parse(fs.readFileSync('wrangler.editor.authors.staging.json','utf8'))
          if(c.name!=='faultlinebrief-editor-authors-staging'||c.d1_databases?.length!==1||c.d1_databases[0].database_id!=='d296847d-9bf7-490d-bc95-48345022a938'||c.r2_buckets?.[0]?.bucket_name!=='faultlinebrief-staging-media'||c.routes?.length)throw Error('Unsafe staging Worker configuration')
          console.log('PASS staging Worker is distinct from production')
          NODE
          node --check cloudflare-editor/worker.js
          node --check cloudflare-editor/admin-page.js
      - name: Install CMS dependency
        run: npm install --no-save --no-package-lock pg@8
      - name: Deploy isolated staging Worker (never production Worker)
        run: npx --yes wrangler@4.151.1 deploy --config wrangler.editor.authors.staging.json
      - name: Verify rendered CMS controls without Cloudflare edge access restrictions
        run: |
          node --input-type=module <<'NODE'
          import {adminHtml} from './cloudflare-editor/admin-page.js'
          for (const id of ['addAuthor','newAuthor','editAuthor']) {
            if (!adminHtml.includes(id)) throw Error('Missing author control: '+id)
          }
          console.log('PASS deployed source includes author controls')
          NODE
      - name: Diagnose external staging access without masking 403
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error
          base='https://faultlinebrief-editor-authors-staging.zakria25.workers.dev'
          for path in ['/admin','/editor/authors']:
              req=urllib.request.Request(base+path,headers={'User-Agent':'FaultlineBrief-Staging-Smoke/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      status=r.status
                      body=r.read(4096).decode('utf-8','replace')
                      headers=r.headers
              except urllib.error.HTTPError as e:
                  status=e.code
                  body=e.read(4096).decode('utf-8','replace')
                  headers=e.headers
              print('path:',path,'status:',status,'server:',headers.get('Server'),'cf-ray-present:',bool(headers.get('cf-ray')))
              if status==200 and path=='/admin':
                  assert 'addAuthor' in body or '<!doctype html' in body.lower()
              elif status==403:
                  print('External access forbidden; investigate Cloudflare edge/Access policies. This does NOT prove Worker runtime failed.')
              elif status not in (200,401,403):
                  raise SystemExit('Unexpected HTTP status: '+str(status))
          PY
          echo "Staging Worker deployed. Static CMS controls validated. Remote HTTP access diagnostics recorded; authenticated author CRUD not yet verified." >> "$GITHUB_STEP_SUMMARY"
