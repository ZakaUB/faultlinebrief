name: Audit production article coverage in isolated D1
on:
  push:
    branches: [emergency-neon-to-cloudflare-20261021]
    paths: [.github/workflows/audit-production-d1-coverage.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-staging
    env:
      PRODUCTION_DATABASE_URL: ${{ secrets.NEON_PRODUCTION_READONLY_DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
    steps:
      - name: Install PostgreSQL client
        run: python3 -m pip install --quiet --user 'psycopg[binary]>=3.2,<4'
      - name: Compare published production slugs against isolated D1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.parse,urllib.request
          import psycopg
          source=os.environ.get('PRODUCTION_DATABASE_URL','')
          u=urllib.parse.urlparse(source)
          if u.scheme not in ('postgres','postgresql') or not u.hostname:
            raise SystemExit('Missing NEON_PRODUCTION_READONLY_DATABASE_URL; no changes made')
          if not u.hostname.endswith('.neon.tech'):
            raise SystemExit('Refusing non-Neon source')
          if not os.environ.get('CLOUDFLARE_API_TOKEN') or not os.environ.get('CLOUDFLARE_ACCOUNT_ID'):
            raise SystemExit('Missing staging Cloudflare credentials')
          with psycopg.connect(source,connect_timeout=15) as conn:
            conn.execute('SET TRANSACTION READ ONLY')
            prod={r[0] for r in conn.execute("SELECT slug FROM public.articles WHERE status='published'")}
          url='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/d1/database/d296847d-9bf7-490d-bc95-48345022a938/query'
          def d1(sql):
            req=urllib.request.Request(url,data=json.dumps({'sql':sql}).encode(),headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Content-Type':'application/json'},method='POST')
            with urllib.request.urlopen(req,timeout=40) as resp: data=json.load(resp)
            if not data.get('success') or any(not item.get('success',True) for item in data.get('result',[])):
              raise SystemExit('D1 query failed')
            return [row for item in data.get('result',[]) for row in item.get('results',[])]
          stage={r['slug'] for r in d1('SELECT slug FROM migration_articles')}
          missing=sorted(prod-stage)
          extras=sorted(stage-prod)
          print('Production published:',len(prod),'D1 records:',len(stage),'missing:',len(missing),'D1-only:',len(extras))
          print('Missing published slugs:',json.dumps(missing))
          print('D1-only test slugs:',sum(x.startswith('cf-staging-test-') for x in extras))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('### Read-only production/D1 coverage audit\n')
            f.write(f'Production published: {len(prod)}; D1 records: {len(stage)}; missing: {len(missing)}\n')
            for slug in missing: f.write('- Missing: `'+slug+'`\n')
            f.write('No database writes performed.\n')
          if missing: raise SystemExit('BLOCK CUTOVER: production published slugs absent from D1')
          print('PASS published production slug coverage (content/media parity still required)')
          PY
