name: SonicJS staging login diagnostics
on:
  push:
    branches: [cloudflare-staging-migration]
    paths: ['.github/workflows/sonicjs-login-diagnostics.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    timeout-minutes: 5
    steps:
      # Staging diagnostic rerun requested 2026-10-17; no production resources touched.
      - name: Verify Cloudflare gateway and classify SonicJS response
        env:
          STAGING_ACCESS_PASSWORD: ${{ secrets.CLOUDFLARE_STAGING_ACCESS_PASSWORD }}
        run: |
          set -euo pipefail
          test "${#STAGING_ACCESS_PASSWORD}" -ge 24
          python3 - <<'PY'
          import os,json,base64,urllib.request,urllib.error,re
          base='https://faultlinebrief-sonicjs-cms-staging.zakria25.workers.dev'
          auth='Basic '+base64.b64encode(('staging:'+os.environ['STAGING_ACCESS_PASSWORD']).encode()).decode()
          def request(path,method='GET',data=None):
            headers={'Authorization':auth,'Accept':'application/json','Origin':base}
            if data is not None: headers['Content-Type']='application/json'
            req=urllib.request.Request(base+path,headers=headers,data=data,method=method)
            try:
              with urllib.request.urlopen(req,timeout=20) as res: return res.status,res.read(8192),dict(res.headers)
            except urllib.error.HTTPError as e: return e.code,e.read(8192),dict(e.headers)
          status,raw,headers=request('/')
          print('STAGING_GATEWAY_HTTP',status)
          print('STAGING_GATEWAY_HEADER',headers.get('X-SonicJS-Gateway',headers.get('x-sonicjs-gateway','absent')))
          print('STAGING_EDGE_RAY_PRESENT',bool(headers.get('Cf-Ray',headers.get('cf-ray'))))
          try: obj=json.loads(raw)
          except (ValueError,UnicodeError): obj={}
          if isinstance(obj,dict) and ('cloudflare_error' in obj or 'ray_id' in obj):
            print('STAGING_GATEWAY_BLOCK','cloudflare_edge')
            print('STAGING_CLOUDFLARE_ERROR_CODE',str(obj.get('error_code','unknown'))[:80])
            print('STAGING_CLOUDFLARE_ERROR_NAME',str(obj.get('error_name','unknown'))[:80])
            raise SystemExit('Cloudflare blocked staging request before application')
          print('STAGING_GATEWAY_BLOCK','none_detected')
          if headers.get('X-SonicJS-Gateway',headers.get('x-sonicjs-gateway'))!='passed': raise SystemExit('Authenticated request did not reach SonicJS gateway')
          body=json.dumps({'email':'nonexistent-login-diagnostic@example.invalid','password':'invalid-login-diagnostic'}).encode()
          status,raw,headers=request('/auth/login','POST',body)
          print('STAGING_LOGIN_HTTP',status)
          try: obj=json.loads(raw)
          except (ValueError,UnicodeError): obj={}
          if isinstance(obj,dict) and ('cloudflare_error' in obj or 'ray_id' in obj):
            print('STAGING_LOGIN_BLOCK','cloudflare_edge')
            print('STAGING_CLOUDFLARE_ERROR_CODE',str(obj.get('error_code','unknown'))[:80])
            raise SystemExit('Cloudflare blocked login before SonicJS')
          if status==403:
            print('STAGING_LOGIN_BLOCK','403_unknown_origin')
            raise SystemExit('403 must be investigated; it is not proof of valid application rejection')
          msg=str(obj.get('error','')) if isinstance(obj,dict) else ''
          categories={'database':r'database|sqlite|drizzle|d1|no such table|no such column','crypto':r'crypto|subtle|hash|scrypt|bcrypt|argon','session':r'session|cookie|token|jwt','runtime':r'unsupported|not implemented|undefined|typeerror','validation':r'validation|invalid credentials|unauthorized'}
          print('STAGING_ERROR_CATEGORY',','.join(k for k,v in categories.items() if re.search(v,msg,re.I)) or 'unclassified')
          print('STAGING_RESPONSE_FIELDS',','.join(sorted(obj.keys())) if isinstance(obj,dict) else 'non-json')
          if status not in (400,401,422): raise SystemExit('Unexpected invalid-login response')
          PY
