name: Audit live Faultline Brief SEO without production changes
# Read-only live endpoint validation; no production writes.
on:
  workflow_dispatch:
  push:
    branches: [emergency-neon-to-cloudflare-20261021]
    paths: [.github/workflows/audit-live-seo-readonly.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public SEO endpoints and linked image responses
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,xml.etree.ElementTree as ET,re,html
          from html.parser import HTMLParser
          base='https://faultlinebrief.com'
          class Meta(HTMLParser):
            def __init__(self): super().__init__();self.canonical=[];self.og=[];self.images=[];self.jsonld=0
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag=='link' and a.get('rel')=='canonical':self.canonical.append(a.get('href',''))
              if tag=='meta' and a.get('property','').startswith('og:'):self.og.append(a.get('property'))
              if tag=='meta' and a.get('property')=='og:image':self.images.append(a.get('content',''))
              if tag=='script' and a.get('type')=='application/ld+json':self.jsonld+=1
          def get(path):
            req=urllib.request.Request(base+path,headers={'User-Agent':'FaultlineBrief-Staging-Audit/1.0'})
            with urllib.request.urlopen(req,timeout=20) as r:return r.status,r.read(2000000),r.headers.get('Content-Type','')
          for path in ('/sitemap.xml','/news-sitemap.xml'):
            status,body,typ=get(path)
            root=ET.fromstring(body)
            urls=[x.text for x in root.iter() if x.tag.endswith('}loc') or x.tag=='loc']
            assert status==200 and root.tag.endswith('urlset'),(path,status,len(urls))
            if path=='/sitemap.xml': assert urls,'Main sitemap unexpectedly empty'
            foreign=[u for u in urls if u != base and not u.startswith(base+'/')]
            if foreign: print('WARNING sitemap noncanonical hostname',path,'count',len(foreign),'examples',foreign[:5])
            print('PASS',path,'urls',len(urls),'content-type',typ)
            if path=='/sitemap.xml':
              articles=[u for u in urls if u.startswith(base+'/articles/')]
          assert articles,'No published articles on canonical domain in main sitemap'
          for url in articles[:3]:
            path=url[len(base):]
            status,body,typ=get(path)
            parser=Meta();parser.feed(body.decode('utf-8','replace'))
            assert status==200 and parser.canonical==[url],(path,'canonical',parser.canonical)
            assert 'og:title' in parser.og and 'og:url' in parser.og,(path,'open graph')
            assert parser.jsonld>0,(path,'structured data')
            print('PASS article',path,'canonical, OG, JSON-LD',parser.jsonld)
            for image in parser.images[:1]:
              if image.startswith(base+'/'):
                p=image[len(base):]
                code,blob,ct=get(p)
                assert code==200 and ct.startswith('image/'),(p,code,ct)
                print('PASS public image',p,'bytes sampled',len(blob))
          print('PASS live read-only SEO baseline. No Cloudflare rendering parity claimed.')
          PY

      - name: Audit navigation, article links, robots, image metadata and source URLs
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,xml.etree.ElementTree as ET,re,concurrent.futures
          from html.parser import HTMLParser
          base='https://faultlinebrief.com'
          def fetch(url):
            req=urllib.request.Request(url,headers={'User-Agent':'FaultlineBrief-ReadOnly-QualityAudit/1.0'})
            try:
              with urllib.request.urlopen(req,timeout=25) as r:return r.status,r.headers.get('Content-Type',''),r.read(3000000)
            except urllib.error.HTTPError as e:return e.code,e.headers.get('Content-Type',''),e.read(1000)
            except Exception as e:return 0,'',str(e).encode()
          class Page(HTMLParser):
            def __init__(self):super().__init__();self.links=[];self.images=[];self.canonical=[];self.h1=0;self.title='';self.intitle=False;self.description=[]
            def handle_starttag(self,t,a):
              d=dict(a)
              if t=='a' and d.get('href'):self.links.append(d['href'])
              if t=='img':self.images.append((d.get('src',''),d.get('alt','')))
              if t=='link' and d.get('rel')=='canonical':self.canonical.append(d.get('href'))
              if t=='meta' and d.get('name')=='description':self.description.append(d.get('content'))
              if t=='h1':self.h1+=1
              if t=='title':self.intitle=True
            def handle_endtag(self,t):
              if t=='title':self.intitle=False
            def handle_data(self,s):
              if self.intitle:self.title+=s
          status,_,sitemap=fetch(base+'/sitemap.xml')
          assert status==200
          root=ET.fromstring(sitemap)
          urls=[x.text for x in root.iter() if x.tag.endswith('}loc') or x.tag=='loc']
          urls=list(dict.fromkeys(urls))
          print('SITEMAP_URLS',len(urls))
          issues=[];source_hosts=set();checked_images=set();internal_links=set()
          def audit(url):
            status,ctype,body=fetch(url)
            if status!=200:return (url,['HTTP '+str(status)],[],[],[])
            p=Page();p.feed(body.decode('utf-8','replace'))
            errors=[]
            if p.h1!=1:errors.append('H1_COUNT='+str(p.h1))
            if not p.title.strip():errors.append('NO_TITLE')
            if not p.description:errors.append('NO_META_DESCRIPTION')
            if p.canonical!=[url]:errors.append('CANONICAL='+str(p.canonical))
            for src,alt in p.images:
              if not alt.strip():errors.append('IMAGE_MISSING_ALT')
            internal=[base+x for x in p.links if x.startswith('/') and not x.startswith('//')]
            return url,errors,internal,p.images,[x for x in p.links if x.startswith('http')]
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
            for url,errors,internal,images,external in pool.map(audit,urls):
              if errors:issues.append((url,errors))
              internal_links.update(internal)
              for src,alt in images:
                if src.startswith('https://faultlinebrief') or src.startswith('/'):checked_images.add(src if src.startswith('http') else base+src)
              for link in external:
                if 'reuters.com' in link:source_hosts.add(link)
          print('PAGES_CHECKED',len(urls),'PAGE_ISSUES',len(issues))
          for item in issues[:35]:print('ISSUE',item)
          print('INTERNAL_LINKS',len(internal_links),'IMAGE_URLS',len(checked_images),'REUTERS_LINKS',len(source_hosts))
          for link in list(sorted(internal_links))[:100]:
            code,_,_=fetch(link)
            if code>=400 or code==0:print('BROKEN_INTERNAL',code,link)
          for link in list(sorted(checked_images))[:30]:
            code,typ,_=fetch(link)
            if code!=200 or not typ.startswith('image/'):print('BROKEN_IMAGE',code,typ,link)
          for path in ['/robots.txt','/news-sitemap.xml']:
            code,typ,body=fetch(base+path)
            print('ENDPOINT',path,code,typ,'bytes',len(body))
          print('READ_ONLY_AUDIT_COMPLETE')
          PY

      - name: Inspect isolated article pages and media endpoints without writes
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,html.parser,xml.etree.ElementTree as ET
          from urllib.parse import urljoin,urlparse
          base='https://faultlinebrief-website-d1-isolated.zakria25.workers.dev'
          class Scan(html.parser.HTMLParser):
            def __init__(self):super().__init__();self.images=[];self.canonical=[];self.h1=0;self.sources=[];self.title=''
            def handle_starttag(self,t,a):
              d=dict(a)
              if t=='img':self.images.append((d.get('src',''),d.get('alt')))
              if t=='link' and d.get('rel')=='canonical':self.canonical.append(d.get('href'))
              if t=='h1':self.h1+=1
              if t=='a' and d.get('href','').startswith('http'):self.sources.append(d['href'])
          def fetch(url):
            req=urllib.request.Request(url,headers={'User-Agent':'FaultlineBrief-Isolated-Media-Audit/1.0'})
            try:
              with urllib.request.urlopen(req,timeout=25) as r:return r.status,r.headers.get('Content-Type',''),r.read(1000000)
            except urllib.error.HTTPError as e:return e.code,e.headers.get('Content-Type',''),e.read(1000)
            except Exception as e:return 0,'',str(e).encode()
          paths=['/articles/putin-european-security-framework-ukraine-peace-talks','/articles/houthi-missile-strike-yemen-shabwa-soldiers-killed','/articles/pakistan-qatar-us-iran-compromise-nuclear-inspections','/articles/colombia-farc-leaders-war-crimes-indigenous-groups-october-2026','/articles/putin-trump-xi-summit-ukraine-peace-talks']
          images=set()
          for path in paths:
            for attempt in range(2):
              status,ct,body=fetch(base+path)
              print('ARTICLE',path,'attempt',attempt+1,'status',status,'type',ct,'bytes',len(body))
              if status==200:
                p=Scan();p.feed(body.decode('utf-8','replace'))
                print('META',path,'h1',p.h1,'canonical',p.canonical,'images',len(p.images),'missing_alt',sum(1 for _,alt in p.images if alt is None),'blank_alt',sum(1 for _,alt in p.images if alt==''))
                for src,alt in p.images:
                  if src.startswith('/') or src.startswith(base):images.add(urljoin(base,src))
                break
          for path in ['/api/media/file/logo.jpg','/api/media/file/who-are-the-houthis-history-sanaa-2014-saudi-arabia-conflict.jpg','/api/media/file/this-file-should-not-exist-20261023.jpg']:
            for attempt in range(2):
              code,ct,body=fetch(base+path)
              print('MEDIA',path,'attempt',attempt+1,'status',code,'type',ct,'bytes_sampled',len(body))
          for url in sorted(images)[:15]:
            code,ct,body=fetch(url)
            print('ARTICLE_IMAGE',code,ct,url)
          print('ISOLATED_READONLY_AUDIT_DONE')
          PY
