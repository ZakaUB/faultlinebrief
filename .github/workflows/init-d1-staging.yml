name: Initialize isolated D1 staging schema
on:
  push:
    branches: [emergency-neon-to-cloudflare-20261021]
    paths: [.github/workflows/init-d1-staging.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated staging credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install Wrangler
        run: npm install --no-save --ignore-scripts wrangler@4
      - name: Verify exact staging database exists
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/faultline-d1-list.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/faultline-d1-list.json'))
          matches=[d for d in data if d.get('name')=='faultlinebrief-d1-staging']
          if len(matches)!=1: raise SystemExit('Expected exactly one isolated staging D1 database')
          print('Verified isolated staging D1 database',matches[0].get('uuid',matches[0].get('id','unknown')))
          PY
      - name: Apply staging-only read-model schema
        run: npx wrangler d1 execute faultlinebrief-d1-staging --remote --file migration-emergency/d1-staging-schema.sql --yes
      - name: Verify four staging tables
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute faultlinebrief-d1-staging --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name LIKE 'migration_%' ORDER BY name" --json > /tmp/faultline-d1-schema-check.json
          python3 - <<'PY'
          import json,os
          obj=json.load(open('/tmp/faultline-d1-schema-check.json'))
          rows=[]
          for part in obj if isinstance(obj,list) else [obj]:
              rows.extend(part.get('results',[]))
          names={r.get('name') for r in rows}
          required={'migration_articles','migration_categories','migration_media','migration_manifest'}
          if not required.issubset(names): raise SystemExit('Missing staging tables: '+str(required-names))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('### Isolated D1 staging schema initialized\n')
              f.write('Verified tables: '+', '.join(sorted(required))+'\n')
              f.write('No production resources modified.\n')
          print('PASS',sorted(required))
          PY
