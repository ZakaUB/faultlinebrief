name: Deploy isolated public D1 preview
on:
  push:
    branches: [emergency-neon-to-cloudflare-20261021]
    paths: [.github/workflows/deploy-public-d1-preview.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy isolated Worker without custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.public.d1.preview.json
      - name: Smoke-test public article API
        run: |
          python3 - <<'PY'
          import json,urllib.request,time,urllib.error
          base='https://faultlinebrief-public-d1-preview.zakria25.workers.dev'
          def get(path):
            for attempt in range(5):
              try:
                with urllib.request.urlopen(urllib.request.Request(base+path,headers={'User-Agent':'Mozilla/5.0 (compatible; FaultlineBriefMigrationCheck/1.0)'}),timeout=30) as r:return json.load(r)
              except urllib.error.HTTPError as e:
                if e.code in (403,429,502,503) and attempt<4:time.sleep(3*(attempt+1));continue
                raise
          health=get('/health')
          data=get('/v1/articles?limit=100')
          assert health.get('ok') is True
          assert len(data.get('items',[]))==40, 'Expected 40 imported articles'
          slug=data['items'][0]['slug']
          article=get('/v1/articles/'+slug)
          assert article.get('slug')==slug
          print('PASS: health, 40 published articles, article detail')
          PY
