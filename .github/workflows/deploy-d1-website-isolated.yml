name: Deploy isolated D1 website
on:
  push:
    branches: [emergency-neon-to-cloudflare-20261021]
    paths: [.github/workflows/deploy-d1-website-isolated.yml, open-next.config.ts, wrangler.website.d1.isolated.json, 'src/app/(frontend)/api/media/file/**', 'src/app/(frontend)/page.tsx', 'src/app/(frontend)/layout.tsx', 'src/app/(frontend)/articles/[slug]/RelatedCoverage.tsx', 'src/app/(frontend)/articles/[slug]/page.tsx', 'src/app/(frontend)/styles.css', 'src/app/(frontend)/sitemap.ts', 'src/app/(frontend)/news-sitemap.xml/route.ts', 'src/app/(frontend)/feed.xml/route.ts', 'src/app/(frontend)/newsroom.ts', 'src/app/(frontend)/robots.ts', 'src/app/(frontend)/about/page.tsx', 'src/app/(frontend)/contact/page.tsx', 'src/app/(frontend)/privacy/page.tsx', 'src/app/(frontend)/editorial-standards/page.tsx', 'src/app/(frontend)/latest-news/page.tsx']
  workflow_dispatch:
  # Redeploy original Faultline Brief logo
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    env:
      DATABASE_URL: ${{ secrets.NEON_PRODUCTION_READONLY_DATABASE_URL }}
      PAYLOAD_SECRET: migration-build-only-not-production
      FAULTLINE_D1_READS: 'true'
      FAULTLINE_D1_API_URL: https://faultlinebrief-public-d1-preview.zakria25.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install OpenNext Cloudflare adapter
        run: pnpm add -D @opennextjs/cloudflare@1.20.13
      - name: Build Next.js
        run: pnpm run build
      - name: Convert Next.js to Cloudflare Worker
        run: pnpm exec opennextjs-cloudflare build
      - name: Deploy isolated Cloudflare website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
        run: npx --yes wrangler@4.45.4 deploy --config wrangler.website.d1.isolated.json

      - name: Verify isolated website HTTP routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://faultlinebrief-website-d1-isolated.zakria25.workers.dev"
          for route in / /latest-news /sitemap.xml /news-sitemap.xml; do
            echo "Checking $route"
            curl --fail-with-body --location --silent --show-error --max-time 35 --retry 2 --output /tmp/faultline-response --write-out "HTTP %{http_code}; bytes %{size_download}; content-type %{content_type}\\n" "$base$route"
            test -s /tmp/faultline-response
          done

      - name: Verify isolated Latest News renders published article links
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json,re
          from html.parser import HTMLParser
          base='https://faultlinebrief-website-d1-isolated.zakria25.workers.dev'
          api='https://faultlinebrief-public-d1-preview.zakria25.workers.dev/v1/articles?limit=100'
          class Links(HTMLParser):
            def __init__(self):super().__init__();self.hrefs=[];self.text=[]
            def handle_starttag(self,t,a):
              if t=='a':
                d=dict(a)
                if d.get('href'):self.hrefs.append(d['href'])
            def handle_data(self,t):self.text.append(t)
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'FaultlineBrief-Deployment-Verification/1.0'})
            with urllib.request.urlopen(req,timeout=30) as r:return r.read().decode('utf-8','replace')
          items=json.loads(get(api))['items']
          news=[x for x in items if x.get('editorialPlacement')=='news']
          page=get(base+'/latest-news')
          parsed=Links();parsed.feed(page)
          links=set(parsed.hrefs)
          expected=['/articles/'+x['slug'] for x in news[:20]]
          missing=[link for link in expected if link not in links]
          print('D1_PUBLISHED_NEWS',len(news),'EXPECTED_FIRST_PAGE',len(expected),'RENDERED_NEWS_LINKS',sum(1 for link in expected if link in links))
          print('MISSING',missing[:10])
          print('UNAVAILABLE_MESSAGE_PRESENT','News updates temporarily unavailable' in page)
          assert 'News updates temporarily unavailable' not in page,'Latest News still showing query error'
          assert not missing,'Published D1 news links missing from page'
          print('PASS Latest News D1 article links and no unavailable message')
          PY

# Redeploy corrected legacy article formatting (2026-10-24).
