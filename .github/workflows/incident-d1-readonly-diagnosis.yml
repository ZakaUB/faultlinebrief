name: Incident read-only production D1 and article API diagnosis
on:
  push:
    branches: [faultline-brief-website]
    paths: [.github/workflows/incident-d1-readonly-diagnosis.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production D1 counts and article delivery without writes
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          account=os.environ['CF_ACCOUNT'];token=os.environ['CF_TOKEN']
          db='cc4cf967-6c3a-4c7d-a5a1-ca3cd9f2d8a9'
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{db}/query'
          queries=[
            ('tables',"SELECT name FROM sqlite_master WHERE type='table' AND name IN ('migration_articles','migration_categories','editorial_authors') ORDER BY name"),
            ('article_status',"SELECT status,COUNT(*) AS count FROM migration_articles GROUP BY status ORDER BY status"),
            ('recent_published',"SELECT slug,published_at FROM migration_articles WHERE status='published' ORDER BY published_at DESC LIMIT 5")
          ]
          report=[]
          for name,sql in queries:
            req=urllib.request.Request(url,data=json.dumps({'sql':sql}).encode(),headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},method='POST')
            try:
              with urllib.request.urlopen(req,timeout=30) as r:data=json.load(r)
              if not data.get('success'):raise Exception(str(data.get('errors'))[:200])
              rows=[row for item in data.get('result',[]) for row in item.get('results',[])]
              print('D1',name,json.dumps(rows))
              report.append((name,rows))
            except Exception as e:
              print('D1 ERROR',name,type(e).__name__,str(e)[:300]);report.append((name,'ERROR '+str(e)[:160]))
          endpoints=[
            ('public-api','https://faultlinebrief-public-d1-preview.zakria25.workers.dev/v1/articles?limit=2'),
            ('public-health','https://faultlinebrief-public-d1-preview.zakria25.workers.dev/health'),
            ('website-home','https://faultlinebrief-website-d1-isolated.zakria25.workers.dev/'),
            ('website-sitemap','https://faultlinebrief-website-d1-isolated.zakria25.workers.dev/sitemap.xml'),
            ('live-home','https://faultlinebrief.com/')
          ]
          for name,endpoint in endpoints:
            req=urllib.request.Request(endpoint,headers={'User-Agent':'FaultlineBrief-ReadOnly-Incident-Diagnostic/1.0'})
            try:
              with urllib.request.urlopen(req,timeout=30) as r:status=r.status;body=r.read(150000).decode('utf-8','replace')
            except urllib.error.HTTPError as e:status=e.code;body=e.read(4000).decode('utf-8','replace')
            except Exception as e:status='NETWORK_ERROR';body=str(e)
            if name=='public-api':
              try:
                data=json.loads(body);print('HTTP',name,status,'items',len(data.get('items',[])),'error',data.get('error'),'sample_slugs',[x.get('slug') for x in data.get('items',[])[:2]])
              except Exception:print('HTTP',name,status,'body_prefix',body[:150])
            else:print('HTTP',name,status,'bytes',len(body),'empty_fallback',('Published stories will appear here' in body),'article_links',body.count('/articles/'),'body_prefix' if status!='200' else 'note',body[:130] if status!='200' else '')
            report.append((name,{'status':status,'bytes':len(body),'empty_fallback':('Published stories will appear here' in body),'article_links':body.count('/articles/')}))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('## Production D1 read-only incident diagnosis\n\n')
            for k,v in report:f.write('- **'+k+'**: `'+json.dumps(v)[:1200].replace('`','')+'`\n')
            f.write('\nNo SQL writes, deployments or Worker changes performed by this workflow.\n')
          PY
