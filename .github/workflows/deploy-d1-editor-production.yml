name: Connect existing CMS Worker to production D1
on:
  push:
    branches: [emergency-neon-to-cloudflare-20261021]
    paths: [.github/workflows/deploy-d1-editor-production.yml, cloudflare-editor/worker.js, cloudflare-editor/admin-page.js]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faultlinebrief-editor-production-cutover
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate explicit production target
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const c=JSON.parse(fs.readFileSync('wrangler.editor.d1.production.json','utf8'))
          if(c.name!=='faultlinebrief-editor-d1-isolated'||c.vars?.EDITOR_PRODUCTION_MODE!=='live')throw Error('invalid CMS target')
          if(c.d1_databases?.[0]?.database_id!=='cc4cf967-6c3a-4c7d-a5a1-ca3cd9f2d8a9')throw Error('invalid production D1')
          if(c.r2_buckets?.[0]?.bucket_name!=='faultlinebriefq-media')throw Error('invalid production R2')
          if(c.routes?.length)throw Error('unexpected routes')
          NODE
          node --check cloudflare-editor/worker.js
          node --check cloudflare-editor/d1-staging-adapter.js
      - name: Install legacy editor build dependency
        run: npm install --no-save --no-package-lock pg@8
      - name: Deploy existing editor with production bindings
        run: npx --yes wrangler@4.45.4 deploy --config wrangler.editor.d1.production.json
      - name: Verify deployed Worker via Cloudflare API
        run: |
          python3 - <<'PY'
          import os,urllib.request,json
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/workers/faultlinebrief-editor-d1-isolated'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token})
          with urllib.request.urlopen(req,timeout=30) as response:
            data=json.load(response)
            assert data.get('success'), data.get('errors')
            print('PASS: existing CMS Worker deployed in Cloudflare account')
          print('Public workers.dev health endpoint is separately protected; no HTTP access assertion.')
          PY
