name: Audit D1 media references and public SEO baseline
on:
  workflow_dispatch:
  push:
    branches: [emergency-neon-to-cloudflare-20261021]
    paths: [.github/workflows/audit-d1-media-readonly.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: cloudflare-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
    steps:
      - name: Check isolated D1 image references and public media
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,urllib.parse
          token=os.environ['CLOUDFLARE_API_TOKEN'];account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          assert token and account,'Missing staging credentials'
          db='d296847d-9bf7-490d-bc95-48345022a938'
          endpoint=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{db}/query'
          def query(sql):
            req=urllib.request.Request(endpoint,data=json.dumps({'sql':sql}).encode(),headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},method='POST')
            with urllib.request.urlopen(req,timeout=30) as resp: data=json.load(resp)
            assert data.get('success'), 'D1 API failure'
            return [r for part in data.get('result',[]) for r in part.get('results',[])]
          rows=query('SELECT id,slug,status,image_json FROM migration_articles ORDER BY id')
          media=query('SELECT id,raw_json FROM migration_media ORDER BY id')
          assert len(rows)==79 and len(media)==43,('Unexpected staging counts',len(rows),len(media))
          media_by_id={str(x['id']):json.loads(x['raw_json']) for x in media}
          published=0;checked=0;errors=[];external=0;staging=0
          for a in rows:
            m=json.loads(a['image_json'])
            if a['status']!='published':continue
            published+=1
            mid=str(m.get('id',''))
            if mid not in media_by_id: errors.append((a['slug'],'missing-media-id'));continue
            if m!=media_by_id[mid]:errors.append((a['slug'],'media-metadata-mismatch'));continue
            raw=m.get('url') or ('/api/media/file/'+urllib.parse.quote(str(m.get('filename',''))))
            if not raw:errors.append((a['slug'],'missing-url'));continue
            url=urllib.parse.urljoin('https://faultlinebrief.com',raw)
            if urllib.parse.urlparse(url).hostname!='faultlinebrief.com':
              external+=1
              continue
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'FaultlineBrief-Migration-Audit/1.0','Range':'bytes=0-1023'})
              with urllib.request.urlopen(req,timeout=12) as response:
                typ=response.headers.get('Content-Type','')
                if response.status not in (200,206) or not typ.startswith('image/'):errors.append((a['slug'],'bad-image-response'))
                else:checked+=1
            except Exception as e: errors.append((a['slug'],type(e).__name__))
          print('D1 articles',len(rows),'D1 media',len(media),'published',published,'public images verified',checked,'external image URLs',external)
          print('IMPORTANT: D1 image metadata and live public image URLs checked; staging R2 object binary availability NOT checked.')
          if errors: print('IMAGE ERRORS',json.dumps(errors[:30]))
          assert not errors,('Image reference or live image failures',len(errors))
          assert checked>0,'No live public images verified'
          print('PASS isolated D1 image metadata references and live public image HTTP responses')
          PY
