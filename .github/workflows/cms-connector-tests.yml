name: CMS connector security checks
on:
  push:
    branches:
      - feature/faultlinebrief-cms-mcp-20261108
    paths:
      - 'cloudflare-editor/**'
      - 'cloudflare-cms-mcp/**'
      - 'tests/cms-approval.test.mjs'
      - '.github/workflows/cms-connector-tests.yml'
  pull_request:
    paths:
      - 'cloudflare-editor/**'
      - 'cloudflare-cms-mcp/**'
      - 'tests/cms-approval.test.mjs'
jobs:
  security-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check cloudflare-editor/publish-approval.js
          node --check cloudflare-editor/approval-page.js
          node --check cloudflare-editor/worker.js
          node --check cloudflare-cms-mcp/worker.js
          node --check cloudflare-cms-mcp/oauth-auth-server.js
          node --check cloudflare-cms-mcp/oauth-resource.js
          node --check cloudflare-cms-mcp/oauth-worker.js
      - name: Run approval authentication tests
        run: node --test tests/cms-approval.test.mjs
      - name: Install OAuth provider dependency
        working-directory: cloudflare-cms-mcp
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify OAuth provider module exports
        working-directory: cloudflare-cms-mcp
        run: node --input-type=module -e "import {OAuthAuthorizationServer,OAuthResourceServer,authorizationErrorRedirect,insufficientScope} from '@cloudflare/workers-oauth-provider'; if (![OAuthAuthorizationServer,OAuthResourceServer,authorizationErrorRedirect,insufficientScope].every(Boolean)) process.exit(1)"
