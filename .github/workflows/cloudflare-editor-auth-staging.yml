name: Cloudflare native editor authentication staging
on:
  push:
    branches: [cloudflare-staging-migration]
    paths: ['cloudflare-editor/**', 'wrangler.editor.staging.jsonc', '.github/workflows/cloudflare-editor-auth-staging.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-and-verify:
    if: github.ref == 'refs/heads/cloudflare-staging-migration'
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
      EDITOR_BOOTSTRAP_PASSWORD: ${{ secrets.CLOUDFLARE_STAGING_ACCESS_PASSWORD }}
      EDITOR_SESSION_SECRET: ${{ secrets.CLOUDFLARE_STAGING_PAYLOAD_SECRET }}
      DATABASE_URL: ${{ secrets.CLOUDFLARE_STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify isolated target and credentials
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const c = JSON.parse(fs.readFileSync('wrangler.editor.staging.jsonc','utf8'))
          if (c.name !== 'faultlinebrief-editor-staging' || c.routes?.length || !c.workers_dev || c.r2_buckets?.[0]?.bucket_name !== 'faultlinebrief-staging-media') throw Error('Staging-only destination required')
          if ((process.env.EDITOR_BOOTSTRAP_PASSWORD||'').length < 24 || (process.env.EDITOR_SESSION_SECRET||'').length < 32) throw Error('Missing strong staging secrets')
          console.log('Isolated editor destination and secret lengths validated')
          NODE
      - name: Install staging database driver
        run: npm install --no-save --no-package-lock pg@8
      - name: Deploy isolated editor Worker
        run: npx --yes wrangler@4.151.1 deploy --config wrangler.editor.staging.jsonc
      - name: Configure isolated editor secrets
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          fs.writeFileSync('/tmp/fb-editor-secrets.json',JSON.stringify({EDITOR_BOOTSTRAP_PASSWORD:process.env.EDITOR_BOOTSTRAP_PASSWORD,EDITOR_SESSION_SECRET:process.env.EDITOR_SESSION_SECRET,DATABASE_URL:process.env.DATABASE_URL}),{mode:0o600})
          NODE
          npx --yes wrangler@4.151.1 secret bulk /tmp/fb-editor-secrets.json --config wrangler.editor.staging.jsonc
          rm -f /tmp/fb-editor-secrets.json
      - name: Verify actual login session and logout on Cloudflare
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,http.cookiejar
          base='https://faultlinebrief-editor-staging.zakria25.workers.dev'
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def call(path,method='GET',payload=None):
            data=json.dumps(payload).encode() if payload is not None else None
            req=urllib.request.Request(base+path,data=data,method=method,headers={'Content-Type':'application/json','User-Agent':'FaultlineBrief-Editor-Staging-CI','Origin':base})
            try: resp=opener.open(req,timeout=35)
            except urllib.error.HTTPError as e: resp=e
            return resp.status,json.loads(resp.read())
          status,body=call('/health')
          assert status==200 and body.get('ok') is True,'health failed'
          status,_=call('/me')
          assert status==401,'anonymous access not blocked'
          status,_=call('/login','POST',{'password':'deliberately-incorrect-password'})
          assert status==401,'invalid password accepted'
          status,body=call('/login','POST',{'password':os.environ['EDITOR_BOOTSTRAP_PASSWORD']})
          assert status==200 and body.get('authenticated') is True,'valid login failed'
          print('EDITOR_LOGIN PASS')
          status,body=call('/me')
          assert status==200 and body.get('authenticated') is True,'session verification failed'
          print('EDITOR_SESSION PASS')
          for endpoint in ('articles','categories'):
            status,body=call('/'+endpoint)
            assert status==200 and isinstance(body.get('items'),list),endpoint+' staging read failed'
            print('EDITOR_'+endpoint.upper()+'_READ PASS count='+str(len(body['items'])))
          import base64
          image=base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIHWP4z8DwHwAFgAI/ScL/nwAAAABJRU5ErkJggg==')
          def upload_image(blob, content_type):
            req=urllib.request.Request(base+'/editor/images',data=blob,method='POST',headers={'Content-Type':content_type,'Content-Length':str(len(blob)),'Origin':base})
            try: response=opener.open(req,timeout=35)
            except urllib.error.HTTPError as e: response=e
            raw=response.read()
            try: body=json.loads(raw)
            except json.JSONDecodeError: body={'non_json_body':raw[:150].decode('utf-8','replace')}
            return response.status,body
          status,_=upload_image(image,'text/plain')
          assert status==415,f'unsupported media type accepted: status={status}, response={raw}'
          status,_=call('/editor/images/'+'0'*32)
          assert status==404,'nonexistent image unexpectedly found'
          status,body=upload_image(image,'image/png')
          assert status==201 and body.get('bytes')==len(image),'R2 image upload failed'
          image_id=body['id']
          print('EDITOR_R2_IMAGE_UPLOAD PASS id='+image_id)
          req=urllib.request.Request(base+'/editor/images/'+image_id)
          with opener.open(req,timeout=35) as response:
            assert response.status==200 and response.headers.get('Content-Type')=='image/png' and response.read()==image,'R2 image retrieval failed'
          print('EDITOR_R2_IMAGE_RETRIEVAL PASS')
          import uuid
          slug='cf-staging-test-'+uuid.uuid4().hex[:16]
          status,body=call('/editor/articles','POST',{'headline':'Cloudflare Staging Editorial Draft Test','deck':'This is a staging-only test article, not an actual news report.','slug':slug})
          assert status==201 and body.get('article',{}).get('status')=='draft','create draft failed'
          article_id=body['article']['id']
          print('EDITOR_ARTICLE_CREATE PASS id='+str(article_id))
          status,body=call('/editor/articles/'+str(article_id),'PATCH',{'action':'edit','headline':'Cloudflare Staging Editorial Edited Test','deck':'Edited successfully in the isolated Cloudflare staging editorial system.'})
          assert status==200 and body.get('article',{}).get('headline')=='Cloudflare Staging Editorial Edited Test','edit draft failed'
          print('EDITOR_ARTICLE_EDIT PASS')
          status,body=call('/editor/articles/'+str(article_id),'PATCH',{'action':'publish','headline':'Cloudflare Staging Editorial Published Test','deck':'Published staging-only verification article. This is not real news.'})
          assert status==200 and body.get('article',{}).get('status')=='published' and body['article'].get('published_at'),'publish failed'
          print('EDITOR_ARTICLE_PUBLISH PASS')
          status,body=call('/logout','POST',{})
          assert status==200,'logout failed'
          status,_=call('/me')
          assert status==401,'logout did not invalidate session'
          print('EDITOR_LOGOUT PASS')
          PY
