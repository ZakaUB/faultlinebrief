name: Inspect isolated SonicJS runtime and schema
on:
  push:
    branches: [cloudflare-staging-migration]
    paths: ['.github/sonicjs-inspect-request.txt']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
      SONICJS_TELEMETRY: 'false'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect published package and D1 metadata without writes
        shell: bash
        run: |
          mkdir -p /tmp/sonic
          cd /tmp/sonic
          npm pack @sonicjs-cms/core@3.0.0-beta.28 --silent >/tmp/pkgname
          tar -xzf "$(cat /tmp/pkgname)"
          echo 'SONIC_MIGRATION_FILES'
          find package/migrations -maxdepth 2 -type f | head -25
          echo 'SONIC_CORE_CONFIG'
          cat package/package.json | grep -E '"(main|exports|module|version|drizzle-orm|better-auth)"' | head -22
          echo 'SONIC_AUTH_FILE_NAMES'
          find package -type f | grep -Ei 'auth|login|migrations' | head -35
          echo 'SONIC_AUTH_REFERENCES'
          grep -R -l -E 'admin/login|/login|sign-in|auth/sign-in' package/dist/*.js | head -12
          echo 'SONIC_AUTH_SCHEMA'
          grep -R -n -i -E 'default.*admin|setup.*admin|admin.*setup|bootstrap|sign-in/email' package/README.md package/package.json 2>/dev/null | head -25 || true
          echo 'SONIC_AUTH_STATUS'
          python3 - <<'PY'
          from pathlib import Path
          import re
          for f in Path('package/dist').glob('*.js'):
            s=f.read_text(errors='ignore')
            for term in ['/admin/login','/login','/api/auth/sign-in/email','/admin/setup']:
              if term in s:
                print('PATH_FOUND', f.name,term)
          PY
          echo 'SONIC_RUNTIME_README'
          sed -n '45,160p' package/README.md | head -115
          echo 'SONIC_AUTH_CONFIG_SNIPPETS'
          python3 - <<'PY'
          from pathlib import Path
          for name in ['package/dist/index.js']:
            s=Path(name).read_text(errors='ignore').splitlines()
            for n,line in enumerate(s):
              if 'admin/login' in line or 'auth/sign-in' in line:
                print('AUTH_LINE',n+1,repr(line[:220]))
          PY
          echo 'SONIC_ADMIN_ROUTE_LOGIC'
          sed -n '850,910p' package/dist/index.js | head -60
          echo 'SONIC_LOGIN_HANDLER'
          sed -n '16835,16895p' package/dist/index.js | head -60
          echo 'SONIC_AUTH_REQUIRED_MIDDLEWARE'
          python3 - <<'PY'
          from pathlib import Path
          for f in Path('package/dist').glob('*.js'):
            s=f.read_text(errors='ignore')
            token='"Authentication required"'
            pos=s.find(token)
            if pos>=0:
              print('AUTH_REQUIRED_FILE',f.name)
              print(s[max(0,pos-750):pos+450].replace('\\n',' ')[:1200])
          PY
          echo 'SONIC_D1_AUTH_COUNTS'
          npx --yes wrangler@4 d1 execute e30e35e4-51df-4d3b-b446-a47ddd55e3c7 --remote --command "SELECT (SELECT count(*) FROM auth_user) AS users,(SELECT count(*) FROM auth_session) AS sessions,(SELECT count(*) FROM documents) AS documents;" --json | python3 -c "import json,sys; x=json.load(sys.stdin);print('SONIC_AUTH_COUNTS',x[0]['results'])"
          echo 'SONIC_AUTH_ROUTE_CODE'
          python3 - <<'PY'
          from pathlib import Path
          for f in Path('package/dist').glob('*.js'):
            s=f.read_text(errors='ignore')
            for term in ['authRoutes.post(\n  "/login"','authRoutes.post(\n  "/register"','/auth/login', 'BETTER_AUTH_SECRET','JWT_SECRET']:
              at=s.find(term)
              if at>=0:
                print('SAMPLE',f.name,repr(term),s[max(0,at-100):at+900].replace('\\n',' ')[:1000])
          PY
          echo 'SONIC_CONFIG_FILES'
          find package/dist -maxdepth 1 -type f -name 'config*' -printf '%f\n' | head -20
          echo 'SONIC_DYNAMIC_CONFIG_REFERENCE'
          grep -l "config-SN7GXG7O" package/dist/*.js | head -10
          echo 'BETTER_AUTH_CONFIG_EXCERPT'
          python3 - <<'PY'
          from pathlib import Path
          for f in Path('package/dist').glob('config-*.js'):
            s=f.read_text(errors='replace')
            if 'createAuth' in s:
              for term in ['function createAuth','var createAuth','betterAuth({','BETTER_AUTH_SECRET','baseURL','basePath']:
                at=s.find(term)
                if at >= 0:
                  snip=s[max(0,at-100):at+700]
                  print('CONFIG_FIND',f.name,term,snip.replace('\\n',' ')[:800])
          PY
          echo 'SONIC_USER_STATE'
          npx --yes wrangler@4 d1 execute e30e35e4-51df-4d3b-b446-a47ddd55e3c7 --remote --command "SELECT (SELECT COUNT(*) FROM auth_user) AS users,(SELECT COUNT(*) FROM auth_account) AS accounts,(SELECT COUNT(*) FROM auth_session) AS sessions;" --json | python3 -c "import sys,json; print('SONIC_USER_COUNTS',json.load(sys.stdin)[0]['results'])"
          echo 'STAGING_CREDENTIAL_DIAGNOSTICS'
          npx --yes wrangler@4 d1 execute e30e35e4-51df-4d3b-b446-a47ddd55e3c7 --remote --command "SELECT u.role AS user_role,u.is_active AS active,u.email_verified AS verified,a.provider_id AS provider,CASE WHEN a.password IS NULL OR a.password='' THEN 'missing' WHEN a.password LIKE 'pbkdf2:%' THEN 'pbkdf2' WHEN a.password LIKE '%:%' THEN 'other_colon_format' ELSE 'non_pbkdf2' END AS account_password_format,CASE WHEN u.password_hash IS NULL OR u.password_hash='' THEN 'missing' WHEN u.password_hash LIKE 'pbkdf2:%' THEN 'pbkdf2' ELSE 'other' END AS legacy_hash_format,CASE WHEN a.user_id=u.id THEN 'matched' ELSE 'mismatch' END AS user_id_match FROM auth_user u LEFT JOIN auth_account a ON a.user_id=u.id LIMIT 3;" --json | python3 -c "import json,sys; print('STAGING_CREDENTIAL_FORMATS',json.load(sys.stdin)[0]['results'])"
          echo 'STAGING_LEGACY_HASH_CONSISTENCY'
          npx --yes wrangler@4 d1 execute e30e35e4-51df-4d3b-b446-a47ddd55e3c7 --remote --command "SELECT CASE WHEN u.password_hash=a.password THEN 'identical' ELSE 'different' END AS stored_hash_match,CASE WHEN a.password LIKE 'pbkdf2:%' THEN 'legacy_pbkdf2' ELSE 'other' END AS hash_type,CASE WHEN length(a.password)>50 THEN 'length_plausible' ELSE 'length_unexpected' END AS hash_length_class FROM auth_user u JOIN auth_account a ON u.id=a.user_id WHERE a.provider_id='credential' LIMIT 1;" --json | python3 -c "import json,sys;print('STAGING_HASH_COMPARISON',json.load(sys.stdin)[0]['results'])"
          echo 'PUBLISHED_PBKDF2_VERIFY_IMPLEMENTATION'
          python3 - <<'PY'
          from pathlib import Path
          for f in Path('package/dist').glob('config-*.js'):
            s=f.read_text(errors='replace')
            for term in ['verifyLegacyPbkdf2','pbkdf2:','baVerifyPassword']:
              index=s.find(term)
              if index>=0: print('PBKDF2_IMPLEMENTATION',f.name,term,s[max(0,index-180):index+1350].replace('\\n',' ')[:1500])
          PY
          echo 'SONIC_D1_TABLE_NAMES'
          cd "$GITHUB_WORKSPACE"
          npx --yes wrangler@4 d1 execute e30e35e4-51df-4d3b-b446-a47ddd55e3c7 --remote --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;" --json | python3 -c "import sys,json; x=json.load(sys.stdin); print([v.get('name') for v in x[0].get('results',[])])"
