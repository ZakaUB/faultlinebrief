name: SonicJS staging login exception capture
on:
  push:
    branches: [cloudflare-staging-migration]
    paths: ['.github/sonicjs-error-capture-request.txt']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
      STAGING_ACCESS_PASSWORD: ${{ secrets.CLOUDFLARE_STAGING_ACCESS_PASSWORD }}
    steps:
      - uses: actions/setup-node@v4
        with: 
          node-version: '22'
      - name: Capture sanitized auth exception with non-existent credentials
        shell: bash
        run: |
          set -euo pipefail
          test "${#STAGING_ACCESS_PASSWORD}" -ge 24
          (timeout 150s npx --yes wrangler@4 tail faultlinebrief-sonicjs-cms-staging --format json > /tmp/sonic-tail.jsonl 2>/tmp/tail-stderr || true) &
          tail_pid=$!
          echo "LIVE_LOGIN_CAPTURE_WINDOW_STARTED"
          sleep 130
          wait "$tail_pid" || true
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          f=Path('/tmp/sonic-tail.jsonl')
          print('TAIL_CAPTURE_BYTES',f.stat().st_size if f.exists() else 0)
          events=[]
          if f.exists():
            raw=f.read_text(errors='replace')
            decoder=json.JSONDecoder()
            offset=0
            while offset<len(raw):
              while offset<len(raw) and raw[offset].isspace():offset+=1
              try: obj,offset=decoder.raw_decode(raw,offset)
              except Exception:
                offset+=1
                continue
              if isinstance(obj,dict):events.append(obj)
          print('TAIL_PARSED_OBJECTS',len(events))
          print('TAIL_EVENT_COUNTS',len(events))
          sensitive=re.compile(r'(bearer|password|authorization|cookie|secret|token|email|credential)',re.I)
          if events:
            for event in events:
              for item in (event.get('logs') or []):
                msg=str(item.get('message','')) if isinstance(item,dict) else str(item)
                if msg and not sensitive.search(msg):
                  print('SERVER_LOG',msg[:250])
              for err in (event.get('exceptions') or []):
                name=str(err.get('name',''))[:70] if isinstance(err,dict) else 'unknown'
                msg=str(err.get('message','')) if isinstance(err,dict) else str(err)
                if sensitive.search(msg): msg='REDACTED'
                print('SERVER_EXCEPTION',name,msg[:500])
          PY
