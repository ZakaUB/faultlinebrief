name: Provision isolated SonicJS session KV
on:
  push:
    branches: [cloudflare-staging-migration]
    paths: ['.github/sonicjs-kv-request.txt']
permissions:
  contents: read
jobs:
  kv:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Provision dedicated session KV through Wrangler
        shell: bash
        run: |
          set -euo pipefail
          echo 'WRANGLER_KV_ATTEMPT'
          npx --yes wrangler@4 kv namespace create faultlinebrief-sonicjs-session-staging
