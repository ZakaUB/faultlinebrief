name: Cloudflare staging authenticated diagnostics (read only)

on:
  push:
    branches: [cloudflare-staging-migration]
    paths: ['.github/staging-auth-diagnostics-request.txt']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/cloudflare-staging-migration'
    environment: cloudflare-staging
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
      STAGING_ACCESS_PASSWORD: ${{ secrets.CLOUDFLARE_STAGING_ACCESS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated staging configuration and required credentials
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const c=JSON.parse(fs.readFileSync('wrangler.staging.jsonc','utf8'))
          if (c.name !== 'faultlinebrief-cf-staging' || c.routes?.length !== 0 || c.workers_dev !== true || c.d1_databases || c.hyperdrive) throw Error('Unsafe staging configuration')
          for (const key of ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','STAGING_ACCESS_PASSWORD']) if (!process.env[key]) throw Error('Missing credential: '+key)
          console.log('Staging isolation and credential presence confirmed')
          NODE
      - name: Inspect Worker deployment using authenticated Cloudflare API
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          base='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/workers/scripts/faultlinebrief-cf-staging'
          for label,suffix in [('deployments','/deployments'),('secrets','/secrets')]:
            req=urllib.request.Request(base+suffix,headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Accept':'application/json'})
            try:
              with urllib.request.urlopen(req,timeout=20) as res:
                data=json.load(res)
                print('CF_API',label,'http',res.status,'success',data.get('success'))
                if label=='secrets' and data.get('success'):
                  keys={item.get('name') for item in (data.get('result') or [])}
                  print('STAGING_SECRET_PRESENCE',{k:k in keys for k in ['DATABASE_URL','PAYLOAD_SECRET','STAGING_ACCESS_PASSWORD']})
                if label=='deployments' and data.get('success'):
                  result=data.get('result') or {}
                  deployments=result.get('deployments',[]) if isinstance(result,dict) else result
                  print('STAGING_DEPLOYMENT_COUNT',len(deployments))
            except urllib.error.HTTPError as exc:
              print('CF_API',label,'http',exc.code,'error (no response body logged)')
          PY
      - name: Classify public staging health response without leaking credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import os,base64,json,urllib.request,urllib.error
          url='https://faultlinebrief-cf-staging.zakria25.workers.dev/staging-health'
          auth=base64.b64encode(('staging:'+os.environ['STAGING_ACCESS_PASSWORD']).encode()).decode()
          req=urllib.request.Request(url,headers={'Authorization':'Basic '+auth,'Accept':'application/json','User-Agent':'FaultlineBrief-Staging-HealthCheck/1.0 (+github-actions; authorized staging verification)'})
          try:
            res=urllib.request.urlopen(req,timeout=20)
          except urllib.error.HTTPError as err:
            res=err
          except Exception as err:
            print('EDGE_CHECK_NETWORK_ERROR',type(err).__name__)
            raise SystemExit(0)
          body=res.read(4096)
          print('EDGE_CHECK',res.status,'content_type',res.headers.get('Content-Type','').split(';')[0])
          try:
            doc=json.loads(body)
            if isinstance(doc,dict):
              allowed=('ok','step','directPostgres','kind','signature','errorName')
              print('STAGING_HEALTH_SAFE',json.dumps({k:doc[k] for k in allowed if k in doc and isinstance(doc[k],(str,bool))}))
              if not any(k in doc for k in ('step','ok')):
                print('EDGE_RESPONSE_NOT_STAGING_DIAGNOSTIC')
                print('EDGE_JSON_TOP_KEYS',sorted(doc.keys()))
                print('EDGE_STRUCTURED_CODE',str(doc.get('error_code','unknown'))[:80], 'category',str(doc.get('error_category','unknown'))[:80], 'owner_action_required',doc.get('owner_action_required'))
                if isinstance(doc.get('errors'),list):
                  print('EDGE_ERROR_CODES',[e.get('code') for e in doc['errors'][:3] if isinstance(e,dict) and isinstance(e.get('code'),int)])
                if isinstance(doc.get('code'),int):
                  print('EDGE_ERROR_CODE',doc['code'])
          except ValueError:
            print('EDGE_RESPONSE_NOT_JSON')
          PY
