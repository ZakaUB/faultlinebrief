name: SonicJS isolated staging access smoke
on:
  push:
    branches: [cloudflare-staging-migration]
    paths: ['.github/sonicjs-access-smoke-request.txt']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    timeout-minutes: 5
    env:
      STAGING_ACCESS_PASSWORD: ${{ secrets.CLOUDFLARE_STAGING_ACCESS_PASSWORD }}
    steps:
      - name: Verify staging gateway and classify CMS auth responses
        shell: bash
        run: |
          test "${#STAGING_ACCESS_PASSWORD}" -ge 24
          base="https://faultlinebrief-sonicjs-cms-staging.zakria25.workers.dev"
          unauth=$(curl --max-time 20 --silent --output /dev/null --write-out '%{http_code}' "$base/admin")
          echo "SONICJS_UNAUTH_HTTP=$unauth"
          test "$unauth" = 401
          auth_code=$(curl --max-time 20 --silent --output /dev/null --write-out '%{http_code}' --user "staging:$STAGING_ACCESS_PASSWORD" --header 'Content-Type: application/json' --header 'Accept: application/json' --data '{"email":"missing-staging-test@example.invalid","password":"incorrect-test-only-value"}' "$base/auth/sign-in/email")
          echo "SONICJS_INVALID_LOGIN_HTTP=$auth_code"
          for route in /auth/login /admin/login /admin /auth/session /auth/get-session /; do
            code=$(curl --max-time 20 --silent --dump-header /tmp/sonic-headers --output /tmp/sonic-body --write-out '%{http_code}' --header "Accept: text/html" --user "staging:$STAGING_ACCESS_PASSWORD" "$base$route")
            marker=$(grep -i '^x-sonicjs-gateway:' /tmp/sonic-headers | tail -1 | tr -d '\r' || true)
            echo "SONICJS_ROUTE $route HTTP=$code $marker"
            test "$marker" = "x-sonicjs-gateway: passed" || exit 1
            if [ "$code" = 401 ]; then
              python3 -c "from pathlib import Path; s=Path('/tmp/sonic-body').read_text(errors='replace').strip(); print('SONIC_401_BODY', repr(s) if len(s)<180 and 'token' not in s.lower() else 'redacted')"
            fi
          done
