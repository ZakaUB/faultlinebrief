name: Emergency restore existing CMS production Worker bindings
on:
  push:
    branches: [cms-d1-author-management-20261117]
    paths:
      - .github/workflows/restore-editor-worker-bindings-20261117.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: emergency-restore-editor-worker-20261117
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: faultline-brief-website
      - name: Validate original production Worker bindings
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const c=JSON.parse(fs.readFileSync('wrangler.editor.d1.production.json','utf8'))
          if(c.name!=='faultlinebrief-editor-d1-isolated'||c.d1_databases?.[0]?.database_id!=='cc4cf967-6c3a-4c7d-a5a1-ca3cd9f2d8a9'||c.r2_buckets?.[0]?.bucket_name!=='faultlinebriefq-media'||c.vars?.EDITOR_PRODUCTION_MODE!=='live')throw Error('Production restore target mismatch')
          console.log('Validated original production Worker configuration')
          NODE
          node --check cloudflare-editor/worker.js
      - name: Install existing CMS dependency
        run: npm install --no-save --no-package-lock pg@8
      - name: Restore original Worker source and production bindings
        run: npx --yes wrangler@4.151.1 deploy --config wrangler.editor.d1.production.json --keep-vars
