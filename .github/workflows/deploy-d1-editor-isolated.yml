name: Deploy isolated D1 editor read-only staging
# Retry after restoring required editor UI module
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
      EDITOR_BOOTSTRAP_PASSWORD: ${{ secrets.CLOUDFLARE_STAGING_ACCESS_PASSWORD }}
      EDITOR_SESSION_SECRET: ${{ secrets.CLOUDFLARE_STAGING_PAYLOAD_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated deployment and credentials
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const c=JSON.parse(fs.readFileSync('wrangler.editor.d1.staging.jsonc','utf8'))
          if(c.name!=='faultlinebrief-editor-d1-isolated'||c.workers_dev!==true||c.routes?.length!==0)throw Error('unsafe Worker destination')
          if(c.d1_databases?.length!==1||c.d1_databases[0].database_id!=='d296847d-9bf7-490d-bc95-48345022a938'||c.d1_databases[0].database_name!=='faultlinebrief-d1-staging')throw Error('unsafe D1 target')
          if(c.r2_buckets?.length!==1||c.r2_buckets[0].bucket_name!=='faultlinebrief-staging-media')throw Error('unsafe R2 target')
          if((process.env.EDITOR_BOOTSTRAP_PASSWORD||'').length<24||(process.env.EDITOR_SESSION_SECRET||'').length<32||!process.env.CLOUDFLARE_API_TOKEN||!process.env.CLOUDFLARE_ACCOUNT_ID)throw Error('missing staging credentials')
          console.log('PASS isolated Worker, D1, R2 and credentials')
          NODE
      - name: Check Worker syntax
        run: node --check cloudflare-editor/worker.js && node --check cloudflare-editor/d1-staging-adapter.js
      - name: Install Worker tooling
        run: npm install --no-save --no-package-lock pg@8
      - name: Verify existing isolated Worker API access
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error, json
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          base='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/workers/faultlinebrief-editor-d1-isolated'
          request=urllib.request.Request(base,headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
          try:
            with urllib.request.urlopen(request,timeout=20) as response:
              print('Worker API status:',response.status)
          except urllib.error.HTTPError as e:
            print('Worker API status:',e.code)
            print('Worker API error:',e.read().decode()[:1200])
            raise
          PY
      - name: Deploy distinct D1 staging Worker
        run: npx --yes wrangler@4.151.1 deploy --config wrangler.editor.d1.staging.jsonc
      - name: Set only staging authentication secrets
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          fs.writeFileSync('/tmp/fb-d1-editor-auth.json',JSON.stringify({EDITOR_BOOTSTRAP_PASSWORD:process.env.EDITOR_BOOTSTRAP_PASSWORD,EDITOR_SESSION_SECRET:process.env.EDITOR_SESSION_SECRET}),{mode:0o600})
          NODE
          npx --yes wrangler@4.151.1 secret bulk /tmp/fb-d1-editor-auth.json --config wrangler.editor.d1.staging.jsonc
          rm -f /tmp/fb-d1-editor-auth.json
      - name: Verify deployed isolated Worker and authenticated D1 reads
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,http.cookiejar
          base='https://faultlinebrief-editor-d1-isolated.zakria25.workers.dev'
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def call(path,method='GET',payload=None):
            data=json.dumps(payload).encode() if payload is not None else None
            req=urllib.request.Request(base+path,data=data,method=method,headers={'Content-Type':'application/json','Origin':base,'User-Agent':'FaultlineBrief-D1-Isolated-CI'})
            try: response=opener.open(req,timeout=40)
            except urllib.error.HTTPError as e: response=e
            return response.status,json.loads(response.read())
          anonymous_status,anonymous_body=call('/me')
          print('Anonymous /me status:',anonymous_status,'body:',anonymous_body)
          assert anonymous_status==401,('anonymous session access not blocked',anonymous_status,anonymous_body)
          status,body=call('/login','POST',{'password':os.environ['EDITOR_BOOTSTRAP_PASSWORD']})
          assert status==200 and body.get('authenticated') is True,('login failed',status)
          assert call('/me')[0]==200,'session failed'
          for path,expected in [('/articles',25),('/categories',3),('/editor/media-library',43)]:
            status,body=call(path)
            assert status==200 and len(body.get('items',[]))==expected,(path,status,body.get('error'))
            print('PASS',path,'count',expected)
          # Verify the newly deployed D1-backed HTML renderer using an actual published slug.
          d1='d296847d-9bf7-490d-bc95-48345022a938'
          endpoint='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/d1/database/'+d1+'/query'
          sql_req=urllib.request.Request(endpoint,data=json.dumps({'sql':"SELECT slug FROM migration_articles WHERE status='published' ORDER BY slug LIMIT 1"}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Content-Type':'application/json'})
          with urllib.request.urlopen(sql_req,timeout=25) as response: d1result=json.load(response)
          assert d1result.get('success'),'D1 slug lookup failed'
          slug=d1result['result'][0]['results'][0]['slug']
          preview_req=urllib.request.Request(base+'/d1-preview/articles/'+slug,headers={'User-Agent':'FaultlineBrief-D1-Isolated-CI'})
          with opener.open(preview_req,timeout=40) as response:
            preview=response.read().decode('utf-8','replace')
            assert response.status==200,'D1 preview not HTTP 200'
            assert response.headers.get('X-Robots-Tag')=='noindex, nofollow','Preview indexability risk'
          assert '<h1>' in preview and '<meta property="og:title"' in preview,'D1 article markup missing'
          assert '<link rel="canonical" href="https://faultlinebrief.com/articles/'+slug+'"' in preview,'D1 canonical mismatch'
          assert 'application/ld+json' in preview and 'NewsArticle' in preview,'NewsArticle structured data missing'
          print('PASS authenticated D1 preview article',slug,'canonical, OG, NewsArticle, noindex')
          status,_=call('/editor/articles','POST',{'headline':'blocked'})
          assert status==405,('write unexpectedly allowed',status)
          # Exercise disposable D1 article lifecycle without touching imported content.
          import uuid
          slug='cf-staging-test-ci-'+uuid.uuid4().hex[:12]
          payload={'slug':slug,'headline':'D1 staging draft verification','status':'draft','deck':'Staging only','body':{'root':{'type':'root','children':[{'type':'paragraph','children':[{'text':'D1 lifecycle test'}]}]}},'sources':[{'name':'CI test'}]}
          status,result=call('/editor/articles','POST',payload)
          assert status==201 and result.get('article',{}).get('id'),('D1 draft create failed',status,result)
          article_id=result['article']['id']
          assert call('/editor/articles/'+article_id)[0]==200,'D1 draft read failed'
          payload['status']='published'
          status,result=call('/editor/articles/'+article_id,'PATCH',payload)
          assert status==200 and result.get('article',{}).get('status')=='published',('D1 publish failed',status,result)
          with opener.open(urllib.request.Request(base+'/d1-preview/articles/'+slug,headers={'User-Agent':'FaultlineBrief-D1-Isolated-CI'}),timeout=40) as response:
            html=response.read().decode()
            assert response.status==200 and 'D1 staging draft verification' in html,'Published D1 article missing'
          status,denied=call('/editor/articles','POST',{'slug':'not-a-test','headline':'must fail'})
          assert status==405,('Imported article write guard failed',status,denied)
          print('PASS D1 draft/create/read/publish/preview lifecycle and imported-content write guard:',slug)

          PY
