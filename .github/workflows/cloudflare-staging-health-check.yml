name: Cloudflare staging isolated health check

on:
  push:
    branches: [cloudflare-staging-migration]
    paths: ['.github/workflows/cloudflare-staging-health-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-staging
    env:
      STAGING_ACCESS_PASSWORD: ${{ secrets.CLOUDFLARE_STAGING_ACCESS_PASSWORD }}
    steps:
      - name: Test protected diagnostic endpoint without revealing credentials
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const password = process.env.STAGING_ACCESS_PASSWORD;
          if (!password || password.length < 24) throw Error('Staging access secret missing');
          const url = 'https://faultlinebrief-cf-staging.zakria25.workers.dev/__staging-health';
          const authorization = 'Basic ' + Buffer.from('staging:' + password).toString('base64');
          const response = await fetch(url, {headers:{authorization},signal:AbortSignal.timeout(25000)});
          const type = response.headers.get('content-type')||'';
          const text = await response.text();
          let result;
          try {result=JSON.parse(text);} catch {result={ok:false,step:'non-json-response',kind:'worker-error',status:response.status};}
          const safe = {httpStatus:response.status,ok:result.ok===true,step:result.step||'unknown',kind:result.kind||'none',errorName:result.errorName||'none',noindex:(response.headers.get('x-robots-tag')||'').includes('noindex')};
          console.log(JSON.stringify(safe));
          if (response.status !== 200 || result.ok !== true) process.exitCode=1;
          NODE
